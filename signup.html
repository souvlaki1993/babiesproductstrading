<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Babies Baby Products Trading</title>

    <link rel="stylesheet" href="loginstyle.css">
    <link rel="stylesheet" href="common.css">
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="top-bar"></div>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html">Babies <span>Baby Products Trading</span></a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="pages.html">About</a></li>
                <li><a href="shop.html">Shop</a></li>
            </ul>

            <button class="nav-auth-btn" onclick="window.location.href='login.html'">
                Already a Member?
            </button>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Create Account</h2>

            <form id="signup-form">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" required>
                    <label>
                        I agree to the 
                        <a href="terms.html" target="_blank">Terms and Conditions</a>
                    </label>
                </div>

                <button type="submit" class="login-btn">Sign Up</button>
            </form>

            <p class="auth-link">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <h3>Babies Baby Products Trading</h3>
        <p>Join us to shop with ease and enjoy a better experience.</p>

        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a> |
            <a href="terms.html">Terms & Conditions</a> |
            <a href="pages.html#contact">Contact Us</a>
        </div>
    </footer>

</body>
</html>
